<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIM OTP Manager</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--ln:#e2e5ea;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mu:#9aa1ad;--ln:#2a2f39;--ac:#5b8cff;--ok:#34d399;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mu:#9aa1ad;--ln:#2a2f39;--ac:#5b8cff;--ok:#34d399;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:720px;margin:auto}
h1{font-size:18px;margin:4px 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button.alt,.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
button.del{background:none;color:var(--bad);padding:4px 8px}
input[type=text],input[type=number],input[type=search]{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;min-width:0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
#scan{display:none}#scan video{width:100%;border-radius:10px;background:#000;max-height:260px;object-fit:cover}
.row{display:flex;gap:8px;align-items:center}
.row>input[type=text]{flex:1}
.mu{color:var(--mu);font-size:13px}
.num{font-size:19px;font-weight:700;letter-spacing:.5px}
.slot{width:64px;text-align:center;font-weight:700}
.slot.dup{border-color:var(--bad)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.sites{display:none;margin-top:10px;border-top:1px solid var(--ln);padding-top:8px}
.card.open .sites{display:block}
.cat{font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px}
.site{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:6px}
.site input{width:20px;height:20px;accent-color:var(--ok)}
.site.on{opacity:.55;text-decoration:line-through}
.site .p{margin-left:auto;font-weight:700}
.pill{background:var(--bg);border:1px solid var(--ln);border-radius:99px;padding:2px 9px;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;position:relative}
.menu{position:absolute;right:0;top:40px;background:var(--card);border:1px solid var(--ln);border-radius:10px;display:none;z-index:8;min-width:170px;overflow:hidden}
.menu.show{display:block}
.menu div{padding:12px 14px;cursor:pointer}.menu div+div{border-top:1px solid var(--ln)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:440px;max-height:80%;overflow:auto;width:100%}
#modal h2{margin:0 0 10px;font-size:17px}#modal ol{padding-left:20px;margin:0 0 12px}#modal li{margin-bottom:8px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;margin:3px 4px 3px 0;cursor:pointer;font-size:14px}
.chip b{color:var(--ac)}
body.desk{max-width:none;padding:12px 20px}
#sheet{display:none;overflow:auto;max-height:72vh;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin-bottom:10px}
#sheet table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
#sheet th,#sheet td{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:6px 8px;white-space:nowrap;text-align:center;background:var(--card)}
#sheet thead th{position:sticky;top:0;z-index:2;background:var(--bg);line-height:1.2}
#sheet thead tr:nth-child(2) th{top:31px}
#sheet .c1,#sheet .c2{position:sticky;z-index:1}
#sheet .c1{left:0;min-width:64px;max-width:64px}#sheet .c2{left:64px;text-align:left}
#sheet thead .c1,#sheet thead .c2{z-index:3}
#sheet td.on{background:rgba(22,163,74,.2)}
#sheet th.hl{background:var(--ac);color:#fff}
#sheet input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
#sheet .slot{width:48px;padding:4px}
#sheet tr:hover td{filter:brightness(.97)}
.slotb{display:inline-block;min-width:38px;text-align:center;font-weight:700;padding:8px 6px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);user-select:none;cursor:default}
.slotb.q{color:var(--bad);border-style:dashed;cursor:pointer}
.slotb.dup{border-color:var(--bad)}
#sheet .slotb{padding:3px 6px;min-width:34px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;display:none;z-index:9}
</style></head>
<body>
<div class="top"><h1>📶 SIM OTP Manager</h1><button class="alt" id="menuBtn">☰ Menu</button>
<div class="menu" id="menu"><div data-m="how">📖 How to use</div><div data-m="desk" id="deskItem">🖥️ Desktop mode</div><div data-m="name">✏️ Change name</div><div data-m="theme" id="themeItem">🌙 Dark mode</div><div data-m="log">📝 Changelog</div><div data-m="by">👤 Made by Norwell</div></div></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div class="card" id="greet" style="display:none"></div>
<div class="bar">
  <button id="scanBtn">📷 Scan barcode</button>
  <button class="alt" id="dlBtn">💾 Save (.txt)</button>
  <label class="btn alt">📂 Restore<input type="file" id="up" accept=".txt,text/plain" hidden></label>
</div>
<div class="card" id="scan">
  <video id="vid" playsinline muted></video>
  <div class="row" style="margin-top:8px"><span class="mu" id="scanMsg">Point the camera at the barcode…</span><button class="alt" id="stopBtn" style="margin-left:auto">Stop</button></div>
</div>
<div class="card">
  <div class="row"><input type="text" id="carrier" list="carriers" placeholder="Anong SIM? (optional: Smart, Globe, DITO…)" style="flex:1"><datalist id="carriers"><option>Smart</option><option>TNT</option><option>Sun</option><option>Globe</option><option>TM</option><option>GOMO</option><option>DITO</option></datalist></div>
  <div class="row" style="margin-top:8px"><input type="text" id="manual" inputmode="numeric" maxlength="14" placeholder="Type or speak number"><button class="alt" id="micBtn" title="Voice input" style="padding:10px">🗣️</button><input type="number" id="manualSlot" class="slot" min="1" max="24" placeholder="Box"><button id="addBtn">Add</button></div>
  <div class="mu" style="margin-top:6px">Digits: <b id="cnt">0/11</b> · Ang napiling SIM sa taas ay mase-save kasama ng bawat na-scan o na-type na number.</div>
</div>
<div class="row" style="margin-bottom:10px">
  <input type="search" id="q" placeholder="Search number, box # or site (e.g. Grab)" style="flex:1">
  <span class="pill" id="stats"></span>
</div>
<div id="sitePanel"></div>
<div id="sheet"></div>
<div id="list"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const CATS=[
["FOOD AND DELIVERY",[["FOOD PANDA",10],["JOYRIDE",10],["LALAMOVE",9],["ANGKAS",8],["MOVE IT",7],["GRAB",7],["PICKUP COFFEE",7],["ZUS COFFEE",7]]],
["SOCIAL MEDIA",[["TELEGRAM",15],["WECHAT",10],["TIKTOK",8],["WHATSAPP",7],["VIBER",7],["IG, FB, X",5],["DISCORD",5],["BUMBLE",5],["NIKI",5],["OKCUPID",5]]],
["SHOPPING APPS",[["LAZADA",10],["SHOPEE",10],["TEMU",7],["AMAZON",7],["SHEIN",7],["ZALORA",6],["CAROUSELL",6],["UNIQLO",6]]],
["E-WALLET",[["GCASH (+5 if 3c)",10],["MAYA",10],["PAYPAL",10],["COINSPH",10],["MARIBANK",7],["GOTYME",6],["GRABPAY",6],["CIMB",6]]],
["CASINO SITES",[["BINGO PLUS",10],["GAMEZONE",10],["PH BINGO",5],["PHILSLOT",5],["TARA 777",5],["NEWSTAR",6],["PLAYTIME",8],["OKBET",5],["ARENA PLUS",5],["CASINO PLUS",5],["OTHER SITES/CASINO",5]]]
];
const KEY="sim_otp_manager_v1";
let sims=[],openId=null;
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
function load(){try{const r=localStorage.getItem(KEY);if(r)sims=JSON.parse(r)||[]}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sims))}catch(e){}}
function normNum(t){
  const d=String(t).replace(/\D/g,"");
  if(/^9\d{9}$/.test(d))return "0"+d;
  if(/^09\d{9}$/.test(d))return d;
  if(/^639\d{9}$/.test(d))return "0"+d.slice(2);
  return null;
}
function addSim(num,slot,carrier){
  num=normNum(num);
  if(!num){toast("Not a valid phone number (10 or 11 digits)");return false}
  if(sims.some(s=>s.number===num)){toast("Already in list: "+num);return false}
  sims.push({id:Date.now()+Math.random(),number:num,slot:slot||"",carrier:(carrier||"").trim(),used:[]});
  save();render();toast("Added "+num);return true;
}
function copyText(t){
  const ok=()=>toast("Copied: "+t);
  try{navigator.clipboard.writeText(t).then(ok,()=>fb())}catch(e){fb()}
  function fb(){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();ok()}
}
const KEYN="sim_otp_name_v1";let userName=null;
function loadName(){try{userName=localStorage.getItem(KEYN)}catch(e){}}
function saveName(n){userName=n;try{localStorage.setItem(KEYN,n)}catch(e){}}
function greet(){
  const g=$("greet"),h=new Date().getHours(),tm=h<12?"morning":h<18?"afternoon":"evening";
  const names=new Set();CATS.forEach(c=>c[1].forEach(x=>names.add(x[0])));const total=names.size;
  let av=0,nums=0;sims.forEach(s=>{const u=s.used.filter(x=>names.has(x)).length;if(u<total){nums++;av+=total-u}});
  g.style.display="block";
  g.innerHTML=`Hello, good ${tm}${userName?", <b>"+userName.replace(/</g,"&lt;")+"</b>":""}! `+(sims.length?`You have <b>${av}</b> sites available across <b>${nums}</b> numbers for OTP today.`:"Add your first SIM to start.");
}
function askName(){
  $("mbox").innerHTML='<h2>👋 Welcome!</h2><p>Ano ang pangalan mo?</p><input type="text" id="nm" placeholder="Your name" style="width:100%"><div class="row" style="margin-top:10px"><button id="nmok">Save</button><button class="alt" id="nmskip">Skip</button></div>';
  $("modal").style.display="flex";
  const done=v=>{saveName(v);$("modal").style.display="none";greet()};
  $("nmok").onclick=()=>done($("nm").value.trim());
  $("nmskip").onclick=()=>done("");
  $("nm").addEventListener("keydown",e=>{if(e.key==="Enter")$("nmok").click()});
}
let desk=false;const KEYD="sim_otp_desk_v1";
function applyDesk(){document.body.classList.toggle("desk",desk);$("deskItem").textContent=desk?"📱 Mobile mode":"🖥️ Desktop mode"}
function toggleDesk(){desk=!desk;try{localStorage.setItem(KEYD,desk?"1":"0")}catch(e){}applyDesk();render()}
function renderSheet(){
  const sh=$("sheet");
  if(!desk){sh.style.display="none";$("list").style.display="";return}
  $("list").style.display="none";sh.style.display="block";
  const q=$("q").value.trim().toLowerCase(),sy=sh.scrollTop,sx=sh.scrollLeft;
  const arr=sims.slice().sort((a,b)=>(+b.id||0)-(+a.id||0)).filter(s=>!q||s.number.toLowerCase().includes(q)||(s.carrier||"").toLowerCase().includes(q)||String(s.slot)===q);
  const cnt={};sims.forEach(s=>{if(s.slot)cnt[s.slot]=(cnt[s.slot]||0)+1});
  const total=CATS.reduce((n,c)=>n+c[1].length,0);
  let h='<table><thead><tr><th class="c1" rowspan="2">Box</th><th class="c2" rowspan="2">Number</th><th rowspan="2">SIM</th>'+CATS.map(c=>`<th colspan="${c[1].length}">${c[0]}</th>`).join("")+'<th rowspan="2">Used</th><th rowspan="2"></th></tr><tr>';
  CATS.forEach(c=>c[1].forEach(x=>{h+=`<th class="${q.length>=2&&x[0].toLowerCase().includes(q)?"hl":""}">${x[0]}<br>₱${x[1]}</th>`}));
  h+='</tr></thead><tbody>';
  arr.forEach(s=>{
    h+=`<tr data-id="${s.id}"><td class="c1"><span class="slotb ${s.slot?(cnt[s.slot]>1?"dup":""):"q"}" ${s.slot?"":'data-act="edit" title="No box yet — tap to set"'}>${s.slot||"?"}</span></td><td class="c2"><b>${s.number}</b> <button class="alt" data-act="copy" style="padding:2px 7px;font-size:12px">📋</button></td><td>${s.carrier||""}</td>`;
    CATS.forEach(c=>c[1].forEach(x=>{const on=s.used.includes(x[0]);h+=`<td class="${on?"on":""}"><input type="checkbox" data-site="${x[0].replace(/"/g,"&quot;")}" ${on?"checked":""}></td>`}));
    h+=`<td>${s.used.length}/${total}</td><td><button class="alt" data-act="edit" style="padding:2px 7px;font-size:12px">✏️</button> <button class="del" data-act="del">🗑</button></td></tr>`;
  });
  h+='</tbody></table>'+(arr.length?'':'<div class="mu" style="text-align:center;padding:24px">No SIMs to show.</div>');
  sh.innerHTML=h;sh.scrollTop=sy;sh.scrollLeft=sx;
}
$("sheet").addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-id]");if(!tr)return;const s=sims.find(x=>String(x.id)===tr.dataset.id);if(!s)return;
  const a=e.target.dataset.act;
  if(a==="copy")copyText(s.number);
  else if(a==="edit")editSim(s.id);
  else if(a==="del"&&confirm("Delete "+s.number+"?")){sims=sims.filter(x=>x!==s);save();render()}
});
$("sheet").addEventListener("change",e=>{
  const tr=e.target.closest("tr[data-id]");if(!tr)return;const s=sims.find(x=>String(x.id)===tr.dataset.id);if(!s)return;
  if(e.target.dataset.act==="slot"){s.slot=e.target.value;save();render()}
  else if(e.target.dataset.site){const n=e.target.dataset.site;s.used=e.target.checked?[...new Set([...s.used,n])]:s.used.filter(u=>u!==n);save();render()}
});
function cleanNum(v){let d=v.replace(/\D/g,"");if(/^639/.test(d)&&d.length>=12)d="0"+d.slice(2);return d.slice(0,11)}
function editSim(id){
  const s=sims.find(x=>x.id===id);if(!s)return;
  $("mbox").innerHTML=`<h2>✏️ Edit SIM</h2>
  <div class="mu">Phone number (11 digits)</div><input type="text" id="eNum" inputmode="numeric" maxlength="14" style="width:100%;margin-bottom:10px">
  <div class="mu">Network / SIM (optional)</div><input type="text" id="eNet" list="carriers" placeholder="Smart, Globe, DITO…" style="width:100%;margin-bottom:10px">
  <div class="mu">Box # (1–24)</div><input type="number" id="eSlot" min="1" max="24" style="width:100%;margin-bottom:12px">
  <div class="row"><button id="eOk">Save</button><button class="alt" id="eCancel">Cancel</button></div>`;
  $("eNum").value=s.number;$("eNet").value=s.carrier||"";$("eSlot").value=s.slot||"";
  $("modal").style.display="flex";
  $("eNum").addEventListener("input",()=>{$("eNum").value=cleanNum($("eNum").value)});
  $("eCancel").onclick=()=>$("modal").style.display="none";
  $("eOk").onclick=()=>{
    const n=normNum($("eNum").value);
    if(!n){toast("Not a valid phone number (11 digits)");return}
    const bx=$("eSlot").value.trim();if(bx&&(!/^\d+$/.test(bx)||+bx<1||+bx>24)){toast("Box must be 1–24, or leave blank for ?");return}
    if(sims.some(x=>x!==s&&x.number===n)){toast("Number already in list: "+n);return}
    s.number=n;s.carrier=$("eNet").value.trim();s.slot=bx;
    save();render();$("modal").style.display="none";toast("Saved changes");
  };
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const slotCount={};sims.forEach(s=>{if(s.slot)slotCount[s.slot]=(slotCount[s.slot]||0)+1});
  const arr=sims.slice().sort((a,b)=>(+b.id||0)-(+a.id||0));
  let html="",earn=0;
  sims.forEach(s=>s.used.forEach(u=>{CATS.forEach(c=>c[1].forEach(x=>{if(x[0]===u)earn+=x[1]}))}));
  arr.filter(s=>!q||s.number.toLowerCase().includes(q)||(s.carrier||"").toLowerCase().includes(q)||String(s.slot)===q).forEach(s=>{
    const total=CATS.reduce((n,c)=>n+c[1].length,0);
    html+=`<div class="card ${openId===s.id?"open":""}" data-id="${s.id}">
    <div class="head" data-act="toggle"><div><div class="num">${s.number} <button class="alt" data-act="copy" style="padding:4px 9px;font-size:13px">📋 Copy</button></div><div class="mu">${s.carrier?s.carrier+" · ":""}${s.used.length}/${total} sites used</div></div>
    <div class="row" data-act="none"><span class="mu">Box</span><span class="slotb ${s.slot?(slotCount[s.slot]>1?"dup":""):"q"}" ${s.slot?"":'data-act="edit" title="No box yet — tap to set"'}>${s.slot||"?"}</span><button class="alt" data-act="edit" style="padding:6px 9px" title="Edit">✏️</button><button class="del" data-act="del">🗑</button></div></div>
    <div class="sites">`;
    if(openId===s.id){CATS.forEach(c=>{html+=`<div class="cat">${c[0]}</div>`;c[1].forEach(x=>{const on=s.used.includes(x[0]);
      html+=`<label class="site ${on?"on":""}"><input type="checkbox" data-act="chk" data-site="${x[0].replace(/"/g,"&quot;")}" ${on?"checked":""}><span>${x[0]}</span><span class="p">₱${x[1]}</span></label>`})})}
    html+=`</div></div>`;
  });
  let sp="";
  if(q.length>=2){CATS.forEach(c=>c[1].forEach(x=>{if(x[0].toLowerCase().includes(q)){
    const av=arr.filter(s=>!s.used.includes(x[0]));
    sp+=`<div class="card"><div class="head" style="cursor:default"><b>${x[0]}</b><span class="pill">₱${x[1]} · ${av.length} available</span></div><div style="margin-top:8px">`+
    (av.length?av.map(s=>`<span class="chip" data-open="${s.id}">${s.slot?"📦 <b>"+s.slot+"</b> · ":""}${s.number} <span data-copy="${s.number}" title="Copy">📋</span></span>`).join(""):'<span class="mu">No available number</span>')+`</div></div>`}}))}
  $("sitePanel").innerHTML=sp;
  $("list").innerHTML=html||(sp?"":'<div class="mu" style="text-align:center;padding:30px">No SIMs yet. Scan or type a number.</div>');
  renderSheet();greet();
  $("stats").textContent=sims.length+" SIMs · ₱"+earn+" done";
}
$("list").addEventListener("click",e=>{
  const card=e.target.closest(".card");if(!card)return;
  const id=card.dataset.id,s=sims.find(x=>String(x.id)===id),act=e.target.dataset.act||(e.target.closest("[data-act]")||{dataset:{}}).dataset.act;
  if(!s)return;
  if(act==="copy"){copyText(s.number);return}
  if(act==="edit"){editSim(s.id);return}
  if(act==="del"){if(confirm("Delete "+s.number+"?")){sims=sims.filter(x=>x!==s);save();render()}}
  else if(act==="chk"){const n=e.target.dataset.site;s.used=e.target.checked?[...new Set([...s.used,n])]:s.used.filter(u=>u!==n);save();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(act==="toggle"){openId=openId===s.id?null:s.id;render()}
});
$("list").addEventListener("change",e=>{
  if(e.target.dataset.act==="slot"){const card=e.target.closest(".card"),s=sims.find(x=>String(x.id)===card.dataset.id);
    if(s){s.slot=e.target.value;save();render()}}
});
$("q").addEventListener("input",render);
function fixManual(){
  let d=$("manual").value.replace(/\D/g,"");
  if(/^639/.test(d)&&d.length>=12)d="0"+d.slice(2);
  d=d.slice(0,11);$("manual").value=d;
  const c=$("cnt");c.textContent=d.length+"/11";c.style.color=(d.length===11||(d.length===10&&d[0]==="9"))?"var(--ok)":"";
}
$("manual").addEventListener("input",fixManual);
$("addBtn").onclick=()=>{if(addSim($("manual").value,$("manualSlot").value,$("carrier").value)){$("manual").value="";$("manualSlot").value="";fixManual()}};
/* ---------- Voice input ---------- */
const W={zero:0,oh:0,o:0,sero:0,one:1,isa:1,two:2,to:2,too:2,dalawa:2,three:3,tatlo:3,four:4,for:4,apat:4,five:5,lima:5,six:6,anim:6,seven:7,pito:7,eight:8,ate:8,walo:8,nine:9,siyam:9,syam:9};
function parseSpoken(t){
  let out="",rep=1;
  t.toLowerCase().split(/[^a-z0-9]+/).forEach(w=>{
    if(!w)return;
    if(w==="double"||w==="dobol"){rep=2;return}
    if(w==="triple"){rep=3;return}
    let d=null;
    if(/^\d+$/.test(w))d=w;else if(w in W)d=String(W[w]);
    if(d!==null){out+=d.length===1?d.repeat(rep):d;rep=1}
  });
  return out;
}
let rec=null;
$("micBtn").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voice input not supported. Use Chrome.");return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang="en-PH";rec.interimResults=true;rec.continuous=false;
  $("micBtn").textContent="🔴";toast("Listening… say the number");
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript+" ";const d=parseSpoken(t);if(d){$("manual").value=d;fixManual()}};
  rec.onerror=e=>{toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"Allow microphone access first":"Voice error: "+e.error)};
  rec.onend=()=>{rec=null;$("micBtn").textContent="🗣️";const n=normNum($("manual").value);if(n)toast("Heard: "+n+" — press Add")};
  try{rec.start()}catch(e){rec=null;$("micBtn").textContent="🗣️"}
};
$("manual").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});

/* ---------- Scanner ---------- */
let stream=null,reader=null,running=false,last="",lastT=0;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=900;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},120)}catch(e){}if(navigator.vibrate)navigator.vibrate(80)}
function onCode(text){
  const now=Date.now();if(text===last&&now-lastT<3000)return;last=text;lastT=now;
  const num=normNum(text);
  if(!num){const d=text.replace(/\D/g,"");
    if(/^89\d{16,18}$/.test(d)){$("scanMsg").textContent="That's the ICCID, not the phone number. Type the number printed on the tray (e.g. 0934 898 8797).";$("manual").focus();return}
    $("scanMsg").textContent="Ignored (not a phone number): "+text;return}
  beep();$("scanMsg").textContent="Scanned: "+num;
  addSim(num,"",$("carrier").value);
}
async function startScan(){
  $("scan").style.display="block";running=true;$("scanMsg").textContent="Starting camera…";
  try{
    const v=$("vid");
    if("BarcodeDetector" in window){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      v.srcObject=stream;await v.play();$("scanMsg").textContent="Point the camera at the barcode…";
      const det=new BarcodeDetector();
      (async function loop(){if(!running)return;try{const r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}catch(e){}setTimeout(loop,200)})();
    }else if(window.ZXing){
      reader=new ZXing.BrowserMultiFormatReader();
      $("scanMsg").textContent="Point the camera at the barcode…";
      await reader.decodeFromConstraints({video:{facingMode:"environment"}},v,(res)=>{if(res)onCode(res.getText())});
    }else throw new Error("No scanner available");
  }catch(err){$("scanMsg").textContent="Camera unavailable. Open this file in your phone browser (Chrome) & allow camera, or type the number.";running=false}
}
function stopScan(){running=false;try{reader&&reader.reset()}catch(e){}reader=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("scan").style.display="none"}
$("scanBtn").onclick=startScan;$("stopBtn").onclick=stopScan;

/* ---------- Save / Restore ---------- */
$("dlBtn").onclick=()=>{
  const d=new Date(),stamp=d.toISOString().slice(0,16).replace(/[-:T]/g,"");
  const blob=new Blob([JSON.stringify({app:"sim-otp-manager",v:2,name:userName||"",sims},null,1)],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sim-list-"+stamp+".txt";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Saved file");
};
$("up").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.sims))throw 0;
      sims=d.sims.map(s=>({id:s.id||Date.now()+Math.random(),number:String(s.number),slot:s.slot||"",carrier:s.carrier||"",used:Array.isArray(s.used)?s.used:[]}));
      if(d.name&&!userName)saveName(d.name);save();render();toast("Restored "+sims.length+" SIMs");
    }catch(x){toast("Invalid file")}
    e.target.value="";
  };r.readAsText(f);
};
const HOW=`<h2>📖 Paano gamitin</h2><ol>
<li><b>Pangalan:</b> sa unang buksan, itatanong ang pangalan mo. Lalabas ito sa greeting sa taas. Pwede mo itong palitan sa ☰ Menu → Change name.</li>
<li><b>Greeting:</b> ipinapakita nito kung ilang site pa ang available at sa ilang number. Awtomatiko itong nagbabago kapag nagdagdag ka ng number o nag-check ng site.</li>
<li><b>Anong SIM:</b> sa box sa taas, i-type o piliin ang SIM (Smart, Globe, DITO, atbp.). Optional ito. Mase-save ito kasama ng susunod mong idadagdag na number.</li>
<li><b>Magdagdag ng SIM:</b> pindutin ang <b>📷 Scan barcode</b> at itutok sa barcode ng phone number (Smart: yung 10-digit na nagsisimula sa 9). O i-type ang number at pindutin ang <b>Add</b>.</li>
<li><b>Voice input:</b> pindutin ang 🗣️ sa tabi ng number box at sabihin ang number (hal. "zero nine five five…" o "siyam, apat…"). Pwede ang "double" at "triple". Susuriin ang lumabas na number, saka pindutin ang <b>Add</b>. Chrome ang pinakamainam gamitin.</li>
<li><b>Limit:</b> 11 digits lang ang tatanggapin sa input para walang sobra kapag nagkamali ng type.</li>
<li><b>Ayos ng listahan:</b> ang pinakabagong idinagdag na number ay laging nasa taas, at ang mga luma ay nasa ibaba.</li>
<li><b>Edit:</b> pindutin ang ✏️ sa tabi ng Box para i-edit ang number, network (o idagdag kung wala pa), at box. Susuriin kung valid at hindi pa ito nasa listahan.</li>
<li><b>Box #:</b> ang grid (1–24) ng sim tray kung nasaan ang SIM. Hindi ito pwedeng i-click para hindi magalaw nang hindi sinasadya. Kung walang box, "?" ang lalabas. I-tap ang "?" o ang ✏️ para magtakda o magpalit. Kulay pula ang box kung may kapareho.</li>
<li><b>Mag-check ng site:</b> i-tap ang SIM para lumabas ang mga site. I-check ang site kapag nakuha mo na ang OTP para hindi madoble.</li>
<li><b>Hanapin ang available:</b> sa search, i-type ang pangalan ng site (hal. <i>Grab</i>) para makita ang mga number na available pa. I-tap ang number para makita ito nang buo, at pindutin ang <b>📋 Copy</b> para ipadala sa buyer.</li>
<li><b>Desktop mode:</b> sa ☰ Menu → Desktop mode, lalapad ang page at lalabas ang lahat ng number at site sa isang table na parang Google Sheet. I-check lang ang cell ng site. Pindutin ulit para bumalik sa Mobile mode.</li>
<li><b>Dark mode:</b> sa ☰ Menu, pindutin ang Dark mode para sa madilim na kulay. Pindutin ulit para sa Light mode.</li>
<li><b>Changelog:</b> sa ☰ Menu, makikita ang lahat ng pagbabago sa page.</li>
<li><b>Save:</b> awtomatikong nase-save ang lahat sa browser. Para sa backup, pindutin ang <b>💾 Save (.txt)</b>.</li>
<li><b>Restore:</b> sa ibang phone, pindutin ang <b>📂 Restore</b> at piliin ang .txt file. Babalik lahat ng number, box, at check mark.</li>
<li><b>DITO:</b> ICCID ang barcode nila, hindi ang number. I-type ang number na nakalimbag sa taas ng barcode.</li></ol>
<button id="mclose">Close</button>`;

const KEYT="sim_otp_theme_v1";

function applyTheme(){$("themeItem").textContent=isDark()?"☀️ Light mode":"🌙 Dark mode"}
function toggleTheme(){const n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem(KEYT,n)}catch(e){}applyTheme()}
