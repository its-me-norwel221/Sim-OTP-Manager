<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIM OTP Manager</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--ln:#e2e5ea;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mu:#9aa1ad;--ln:#2a2f39;--ac:#5b8cff;--ok:#34d399;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mu:#9aa1ad;--ln:#2a2f39;--ac:#5b8cff;--ok:#34d399;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:720px;margin:auto}
h1{font-size:18px;margin:4px 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button.alt,.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
button.del{background:none;color:var(--bad);padding:4px 8px}
input[type=text],input[type=number],input[type=search]{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;min-width:0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
#scan{display:none}#scan video{width:100%;border-radius:10px;background:#000;max-height:260px;object-fit:cover}
.row{display:flex;gap:8px;align-items:center}
.row>input[type=text]{flex:1}
.mu{color:var(--mu);font-size:13px}
.num{font-size:19px;font-weight:700;letter-spacing:.5px}
.slot{width:64px;text-align:center;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.sites{display:none;margin-top:10px;border-top:1px solid var(--ln);padding-top:8px}
.card.open .sites{display:block}
.cat{font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px}
.site{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:6px;cursor:pointer}
.site input{width:20px;height:20px;accent-color:var(--ok)}
.site.on{opacity:.55;text-decoration:line-through}
.site .p{margin-left:auto;font-weight:700}
.pill{background:var(--bg);border:1px solid var(--ln);border-radius:99px;padding:2px 9px;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;position:relative}
.menu{position:absolute;right:0;top:40px;background:var(--card);border:1px solid var(--ln);border-radius:10px;display:none;z-index:8;min-width:170px;overflow:hidden}
.menu.show{display:block}
.menu div{padding:12px 14px;cursor:pointer}.menu div+div{border-top:1px solid var(--ln)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:440px;max-height:80%;overflow:auto;width:100%}
#modal h2{margin:0 0 10px;font-size:17px}
#modal ol{padding-left:20px;margin:0 0 12px}
#modal li{margin-bottom:8px}
#modal .notice-img{display:block;width:100%;border-radius:10px;margin-bottom:12px;max-height:280px;object-fit:contain}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;margin:3px 4px 3px 0;cursor:pointer;font-size:14px}
.chip b{color:var(--ac)}
body.desk{max-width:none;padding:12px 20px}
#sheet{display:none;overflow:auto;max-height:72vh;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin-bottom:10px}
#sheet table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
#sheet th,#sheet td{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:6px 8px;white-space:nowrap;text-align:center;background:var(--card)}
#sheet thead th{position:sticky;top:0;z-index:2;background:var(--bg);line-height:1.2}
#sheet thead tr:nth-child(2) th{top:31px}
#sheet .c1,#sheet .c2{position:sticky;z-index:1}
#sheet .c1{left:0;min-width:64px;max-width:64px}
#sheet .c2{left:64px;text-align:left}
#sheet thead .c1,#sheet thead .c2{z-index:3}
#sheet td.on{background:rgba(22,163,74,.2)}
#sheet th.hl{background:var(--ac);color:#fff}
#sheet input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
#sheet tr:hover td{filter:brightness(.97)}
.slotb{display:inline-block;min-width:38px;text-align:center;font-weight:700;padding:7px 6px;border:2px solid var(--ln);border-radius:8px;background:var(--bg);user-select:none}
.slotb.q{color:var(--bad);border-style:dashed;cursor:pointer}
#sheet .slotb{padding:3px 6px;min-width:34px}
.nb{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;margin-right:6px;vertical-align:middle}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;display:none;z-index:9;max-width:90%;text-align:center}
</style>
</head>
<body>

<div class="top">
  <h1>📶 SIM OTP Manager</h1>
  <button class="alt" id="menuBtn">☰ Menu</button>
  <div class="menu" id="menu">
    <div data-m="how">📖 How to use</div>
    <div data-m="desk" id="deskItem">🖥️ Desktop mode</div>
    <div data-m="name">✏️ Change name</div>
    <div data-m="theme" id="themeItem">🌙 Dark mode</div>
    <div data-m="log">📝 Changelog</div>
    <div data-m="by">👤 Made by Norwell</div>
  </div>
</div>

<div id="modal"><div class="box" id="mbox"></div></div>
<div class="card" id="greet" style="display:none"></div>

<div class="bar">
  <button id="scanBtn">📷 Scan barcode</button>
  <button class="alt" id="dlBtn">💾 Save (.txt)</button>
  <label class="btn alt">📂 Restore<input type="file" id="up" accept=".txt,text/plain" hidden></label>
</div>

<div class="card" id="scan">
  <video id="vid" playsinline muted></video>
  <div class="row" style="margin-top:8px">
    <span class="mu" id="scanMsg">Point the camera at the barcode…</span>
    <button class="alt" id="stopBtn" style="margin-left:auto">Stop</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <input type="text" id="carrier" list="carriers" placeholder="Anong SIM? (optional: Smart, Globe, DITO…)" style="flex:1">
    <datalist id="carriers">
      <option>Smart</option><option>TNT</option><option>Sun</option><option>Globe</option>
      <option>TM</option><option>GOMO</option><option>DITO</option>
    </datalist>
  </div>
  <div class="row" style="margin-top:8px">
    <input type="text" id="manual" inputmode="numeric" maxlength="14" placeholder="Type or speak number" style="flex:1">
    <button class="alt" id="micBtn" title="Voice input" style="padding:10px">🗣️</button>
    <input type="number" id="manualSlot" class="slot" min="1" placeholder="Box">
    <button id="addBtn">Add</button>
  </div>
  <div class="mu" style="margin-top:6px">Digits: <b id="cnt">0/11</b> · Ang napiling SIM sa taas ay mase-save kasama ng bawat na-scan o na-type na number.</div>
</div>

<div class="row" style="margin-bottom:10px">
  <input type="search" id="q" placeholder="Number, box 30, sim TNT, or site (e.g. Grab)" style="flex:1">
  <span class="pill" id="stats"></span>
</div>

<div id="sitePanel"></div>
<div id="sheet"></div>
<div id="list"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
/* ---------- One-time notice (edit here) ---------- */
const NOTICE={
  id:"notice_barred_status_oct2026",
  image:"",                         // paste your image URL here, or leave "" for no image
  title:"📢 New update!",
  text:"You can now mark a SIM as <b>Barred</b> or <b>Network not working</b> from the Edit SIM dialog. Badges show on each card and in the desktop table. For more details go to changelog in settings, UPDATED BY MASTER CHI 😗👌  - Oct 11 2026",
  expires:"2026-10-15T23:59:59"     // notice stops showing after this date
};

/* ---------- Data ---------- */
const CATS=[
["FOOD AND DELIVERY",[["FOOD PANDA",10],["JOYRIDE",10],["LALAMOVE",9],["ANGKAS",8],["MOVE IT",7],["GRAB",7],["PICKUP COFFEE",7],["ZUS COFFEE",7]]],
["SOCIAL MEDIA",[["TELEGRAM",15],["WECHAT",10],["TIKTOK",8],["WHATSAPP",7],["VIBER",7],["IG, FB, X",5],["DISCORD",5],["BUMBLE",5],["NIKI",5],["OKCUPID",5]]],
["SHOPPING APPS",[["LAZADA",10],["SHOPEE",10],["TEMU",7],["AMAZON",7],["SHEIN",7],["ZALORA",6],["CAROUSELL",6],["UNIQLO",6]]],
["E-WALLET",[["GCASH (+5 if 3c)",10],["MAYA",10],["PAYPAL",10],["COINSPH",10],["MARIBANK",7],["GOTYME",6],["GRABPAY",6],["CIMB",6]]],
["CASINO SITES",[["BINGO PLUS",10],["GAMEZONE",10],["PH BINGO",5],["PHILSLOT",5],["TARA 777",5],["NEWSTAR",6],["PLAYTIME",8],["OKBET",5],["ARENA PLUS",5],["CASINO PLUS",5],["OTHER SITES/CASINO",5]]]
];
const SITE_COUNT=CATS.reduce((n,c)=>n+c[1].length,0);
const SITE_NAMES=new Set(CATS.flatMap(c=>c[1].map(x=>x[0])));
const NET={smart:["#16a34a","#fff"],tnt:["#eab308","#1a1d23"],dito:["#f97316","#fff"],tm:["#dc2626","#fff"],gomo:["#8b5cf6","#fff"],globe:["#2563eb","#fff"],sun:["#0891b2","#fff"]};
const W={zero:0,oh:0,o:0,sero:0,one:1,isa:1,two:2,to:2,too:2,dalawa:2,three:3,tatlo:3,four:4,for:4,apat:4,five:5,lima:5,six:6,anim:6,seven:7,pito:7,eight:8,ate:8,walo:8,nine:9,siyam:9,syam:9};
const CHANGES=[
 {v:"Latest",items:[
  "<b>Barred and network status:</b> in Edit SIM you can mark a number as Barred or Network not working. Badges show on cards and the desktop table.",
  "<b>Search tips:</b> type <b>box 30</b> to find SIMs in box 30 and see how many are in it, or <b>sim TNT</b> to filter by SIM type. Plain text still searches by number or site.",
  "<b>Box limit removed:</b> box numbers are no longer capped at 24. Any number 1 or higher saves correctly.",
  "<b>Edit fix:</b> editing a SIM with a box number no longer shows the \"must be 1–24\" error."
 ]},
 {v:"Earlier",items:[
  "Voice input for numbers (English and Tagalog number words).",
  "Desktop mode with a full sheet view of all SIMs and sites.",
  "Dark mode, name greeting, save and restore (.txt backup).",
  "Barcode scanner for SIM numbers."
 ]}
];

/* ---------- State ---------- */
const KEY="sim_otp_manager_v1", KEYN="sim_otp_name_v1", KEYD="sim_otp_desk_v1", KEYT="sim_otp_theme_v1", KEYNOTICE="sim_otp_notice_seen";
let sims=[], openId=null, userName=null, desk=false;
const $=id=>document.getElementById(id);

/* ---------- Helpers ---------- */
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
function load(){try{const r=localStorage.getItem(KEY);if(r)sims=JSON.parse(r)||[]}catch(e){sims=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sims))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function normNum(t){
  const d=String(t).replace(/\D/g,"");
  if(/^9\d{9}$/.test(d))return "0"+d;
  if(/^09\d{9}$/.test(d))return d;
  if(/^639\d{9}$/.test(d))return "0"+d.slice(2);
  return null;
}
function cleanNum(v){let d=v.replace(/\D/g,"");if(/^639/.test(d)&&d.length>=12)d="0"+d.slice(2);if(d[0]==="9")d="0"+d;return d.slice(0,11)}
function fmt(n){return String(n).replace(/^(\d{4})(\d{3})(\d{4})$/,"$1-$2-$3")}
function slotBox(s){
  const k=NET[(s.carrier||"").trim().toLowerCase()];
  return s.slot
    ? `<span class="slotb"${k?` style="border-color:${k[0]}"`:""}>${esc(s.slot)}</span>`
    : `<span class="slotb q" data-act="edit" title="No box yet — tap to set">?</span>`;
}
function netBadge(c){
  c=(c||"").trim();if(!c)return"";
  const k=NET[c.toLowerCase()]||["#6b7280","#fff"];
  return `<span class="nb" style="background:${k[0]};color:${k[1]}">${esc(c)}</span>`;
}
function statusBadges(s){
  let h="";
  if(s.barred)h+=`<span class="nb" style="background:#dc2626;color:#fff">🚫 Barred</span>`;
  if(s.netBad)h+=`<span class="nb" style="background:#f97316;color:#fff">📵 Network down</span>`;
  return h;
}
function copyText(t){
  const ok=()=>toast("Copied: "+t);
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();ok()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
function usedCount(s){return s.used.filter(u=>SITE_NAMES.has(u)).length}

/* ---------- Search parsing ---------- */
function parseQuery(raw){
  const q=String(raw||"").trim().toLowerCase();
  let m=q.match(/^box\s*#?\s*(\d+)$/);
  if(m)return {mode:"box",val:m[1]};
  m=q.match(/^sim\s+(.+)$/);
  if(m)return {mode:"sim",val:m[1].trim()};
  return {mode:"auto",val:q};
}
function matchSim(s,p){
  if(!p||!p.val)return true;
  if(p.mode==="box")return String(s.slot)===p.val;
  if(p.mode==="sim")return (s.carrier||"").toLowerCase().includes(p.val);
  const qd=p.val.replace(/[\s-]/g,"");
  return (qd&&s.number.includes(qd))||(s.carrier||"").toLowerCase().includes(p.val)||String(s.slot)===p.val;
}

/* ---------- Add / edit ---------- */
function addSim(num,slot,carrier){
  const n=normNum(num);
  if(!n){toast("Not a valid phone number (10 or 11 digits)");return false}
  if(sims.some(s=>s.number===n)){toast("Already in list: "+fmt(n));return false}
  const bx=String(slot||"").trim();
  if(bx&&(!/^\d+$/.test(bx)||+bx<1)){toast("Box must be a number 1 or higher, or leave blank");return false}
  sims.push({id:Date.now()+Math.random(),number:n,slot:bx,carrier:(carrier||"").trim(),used:[],barred:false,netBad:false});
  save();render();toast("Added "+fmt(n));return true;
}
function editSim(id){
  const s=sims.find(x=>x.id===id);if(!s)return;
  $("mbox").innerHTML=`<h2>✏️ Edit SIM</h2>
  <div class="mu">Phone number (11 digits)</div><input type="text" id="eNum" inputmode="numeric" maxlength="14" style="width:100%;margin-bottom:10px">
  <div class="mu">Network / SIM (optional)</div><input type="text" id="eNet" list="carriers" placeholder="Smart, Globe, DITO…" style="width:100%;margin-bottom:10px">
  <div class="mu">Box #</div><input type="number" id="eSlot" min="1" style="width:100%;margin-bottom:12px">
  <div class="mu" style="margin-bottom:4px">Status</div>
  <label class="site"><input type="checkbox" id="eBarred"><span>🚫 Barred</span></label>
  <label class="site"><input type="checkbox" id="eNetBad"><span>📵 Network not working</span></label>
  <div class="row" style="margin-top:12px"><button id="eOk">Save</button><button class="alt" id="eCancel">Cancel</button></div>`;
  $("eNum").value=fmt(s.number);
  $("eNet").value=s.carrier||"";
  $("eSlot").value=s.slot||"";
  $("eBarred").checked=!!s.barred;
  $("eNetBad").checked=!!s.netBad;
  $("modal").style.display="flex";
  $("eNum").addEventListener("input",()=>{$("eNum").value=fmt(cleanNum($("eNum").value))});
  $("eCancel").onclick=()=>$("modal").style.display="none";
  $("eOk").onclick=()=>{
    const n=normNum($("eNum").value);
    if(!n){toast("Not a valid phone number (11 digits)");return}
    const bx=$("eSlot").value.trim();
    if(bx&&(!/^\d+$/.test(bx)||+bx<1)){toast("Box must be a number 1 or higher, or leave blank for ?");return}
    if(sims.some(x=>x!==s&&x.number===n)){toast("Number already in list: "+fmt(n));return}
    s.number=n;
    s.carrier=$("eNet").value.trim();
    s.slot=bx;
    s.barred=$("eBarred").checked;
    s.netBad=$("eNetBad").checked;
    save();render();$("modal").style.display="none";toast("Saved changes");
  };
}
function deleteSim(s){
  if(confirm("Delete "+fmt(s.number)+"?")){sims=sims.filter(x=>x!==s);save();render()}
}
function toggleSite(s,site,on){
  s.used=on?[...new Set([...s.used,site])]:s.used.filter(u=>u!==site);
  save();
}

/* ---------- Greeting ---------- */
function greet(){
  const g=$("greet"),h=new Date().getHours(),tm=h<12?"morning":h<18?"afternoon":"evening";
  let av=0,nums=0;
  sims.forEach(s=>{const u=usedCount(s);if(u<SITE_COUNT){nums++;av+=SITE_COUNT-u}});
  g.style.display="block";
  g.innerHTML=`Hello, good ${tm}${userName?", <b>"+esc(userName)+"</b>":""}! `+
    (sims.length?`You have <b>${av}</b> sites available across <b>${nums}</b> numbers for OTP today.`:"Add your first SIM to start.");
}

/* ---------- Name ---------- */
function loadName(){try{userName=localStorage.getItem(KEYN)||null}catch(e){}}
function saveName(n){userName=n||null;try{localStorage.setItem(KEYN,n)}catch(e){}}
function askName(initial){
  $("mbox").innerHTML=`<h2>${initial?"👋 Welcome!":"✏️ Change name"}</h2><p>Ano ang pangalan mo?</p>
  <input type="text" id="nm" placeholder="Your name" style="width:100%">
  <div class="row" style="margin-top:10px"><button id="nmok">Save</button><button class="alt" id="nmskip">${initial?"Skip":"Cancel"}</button></div>`;
  $("nm").value=userName||"";
  $("modal").style.display="flex";
  const done=v=>{saveName(v.trim());$("modal").style.display="none";greet();if(initial)maybeNotice()};
  $("nmok").onclick=()=>done($("nm").value);
  $("nmskip").onclick=()=>{$("modal").style.display="none";if(initial){greet();maybeNotice()}};
  $("nm").addEventListener("keydown",e=>{if(e.key==="Enter")$("nmok").click()});
}

/* ---------- One-time notice ---------- */
function maybeNotice(){
  try{
    if(localStorage.getItem(KEYNOTICE)===NOTICE.id)return;
    if(new Date()>new Date(NOTICE.expires))return;
  }catch(e){return}
  $("mbox").innerHTML=`<h2>${NOTICE.title}</h2>`
    +(NOTICE.image?`<img class="notice-img" src="${esc(NOTICE.image)}" alt="">`:"")
    +`<p>${NOTICE.text}</p>`
    +`<div class="row"><button id="nOk">Got it</button></div>`;
  $("modal").style.display="flex";
  $("nOk").onclick=closeNotice;
}
function closeNotice(){
  try{localStorage.setItem(KEYNOTICE,NOTICE.id)}catch(e){}
  $("modal").style.display="none";
}

/* ---------- Desktop / theme ---------- */
function applyDesk(){
  document.body.classList.toggle("desk",desk);
  $("deskItem").textContent=desk?"📱 Mobile mode":"🖥️ Desktop mode";
}
function toggleDesk(){
  desk=!desk;
  try{localStorage.setItem(KEYD,desk?"1":"0")}catch(e){}
  applyDesk();render();
}
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $("themeItem").textContent=t==="dark"?"☀️ Light mode":"🌙 Dark mode";
}
function toggleTheme(){
  const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";
  try{localStorage.setItem(KEYT,next)}catch(e){}
  applyTheme(next);
}

/* ---------- Render ---------- */
function renderSheet(p){
  const sh=$("sheet");
  if(!desk){sh.style.display="none";return}
  sh.style.display="block";
  const q=p.mode==="auto"?p.val:"";
  const sy=sh.scrollTop,sx=sh.scrollLeft;
  const arr=sims.slice().sort((a,b)=>(+b.id||0)-(+a.id||0)).filter(s=>matchSim(s,p));
  let h='<table><thead><tr><th class="c1" rowspan="2">Box</th><th class="c2" rowspan="2">Number</th><th rowspan="2">SIM</th>'
    +CATS.map(c=>`<th colspan="${c[1].length}">${c[0]}</th>`).join("")
    +'<th rowspan="2">Used</th><th rowspan="2"></th></tr><tr>';
  CATS.forEach(c=>c[1].forEach(x=>{
    h+=`<th class="${q.length>=2&&x[0].toLowerCase().includes(q)?"hl":""}">${esc(x[0])}<br>₱${x[1]}</th>`;
  }));
  h+='</tr></thead><tbody>';
  arr.forEach(s=>{
    h+=`<tr data-id="${s.id}"><td class="c1">${slotBox(s)}</td>`
      +`<td class="c2"><b>${fmt(s.number)}</b> <button class="alt" data-act="copy" style="padding:2px 7px;font-size:12px">📋</button></td>`
      +`<td>${netBadge(s.carrier)}${statusBadges(s)}</td>`;
    CATS.forEach(c=>c[1].forEach(x=>{
      const on=s.used.includes(x[0]);
      h+=`<td class="${on?"on":""}"><input type="checkbox" data-act="chk" data-site="${esc(x[0])}" ${on?"checked":""}></td>`;
    }));
    h+=`<td>${usedCount(s)}/${SITE_COUNT}</td><td>`
      +`<button class="alt" data-act="edit" style="padding:2px 7px;font-size:12px">✏️</button> `
      +`<button class="del" data-act="del">🗑</button></td></tr>`;
  });
  h+='</tbody></table>'+(arr.length?'':'<div class="mu" style="text-align:center;padding:24px">No SIMs to show.</div>');
  sh.innerHTML=h;sh.scrollTop=sy;sh.scrollLeft=sx;
}

function renderSitePanel(p,arr){
  let sp="";
  if(p.mode==="box"){
    const inBox=sims.filter(s=>String(s.slot)===p.val);
    sp+=`<div class="card"><div class="head" style="cursor:default"><b>📦 Box ${esc(p.val)}</b>`
      +`<span class="pill">${inBox.length} SIM${inBox.length===1?"":"s"}</span></div><div style="margin-top:8px">`
      +(inBox.length
        ? inBox.map(s=>`<span class="chip" data-open="${s.id}">${fmt(s.number)}${s.carrier?" · "+esc(s.carrier):""} <span data-copy="${s.number}" title="Copy">📋</span></span>`).join("")
        : '<span class="mu">Empty box, no SIM yet</span>')
      +`</div></div>`;
  }
  if(p.mode==="auto"&&p.val.length>=2){
    CATS.forEach(c=>c[1].forEach(x=>{
      if(x[0].toLowerCase().includes(p.val)){
        const av=arr.filter(s=>!s.used.includes(x[0]));
        sp+=`<div class="card"><div class="head" style="cursor:default"><b>${esc(x[0])}</b>`
          +`<span class="pill">₱${x[1]} · ${av.length} available</span></div><div style="margin-top:8px">`
          +(av.length
            ? av.map(s=>`<span class="chip" data-open="${s.id}">${s.slot?"📦 <b>"+esc(s.slot)+"</b> · ":""}${fmt(s.number)} <span data-copy="${s.number}" title="Copy">📋</span></span>`).join("")
            : '<span class="mu">No available number</span>')
          +`</div></div>`;
      }
    }));
  }
  $("sitePanel").innerHTML=sp;
}

function render(){
  const p=parseQuery($("q").value);
  const arr=sims.slice().sort((a,b)=>(+b.id||0)-(+a.id||0));
  const filtered=arr.filter(s=>matchSim(s,p));
  let html="",earn=0;
  sims.forEach(s=>s.used.forEach(u=>CATS.forEach(c=>c[1].forEach(x=>{if(x[0]===u)earn+=x[1]}))));
  filtered.forEach(s=>{
    html+=`<div class="card ${openId===s.id?"open":""}" data-id="${s.id}">`
      +`<div class="head" data-act="toggle"><div>`
      +`<div class="num">${fmt(s.number)} <button class="alt" data-act="copy" style="padding:4px 9px;font-size:13px">📋 Copy</button></div>`
      +`<div class="mu">${netBadge(s.carrier)}${statusBadges(s)}${usedCount(s)}/${SITE_COUNT} sites used</div></div>`
      +`<div class="row"><span class="mu">Box</span>${slotBox(s)}`
      +`<button class="alt" data-act="edit" style="padding:6px 9px" title="Edit">✏️</button>`
      +`<button class="del" data-act="del">🗑</button></div></div>`;
    html+=`<div class="sites">`;
    if(openId===s.id){
      CATS.forEach(c=>{
        html+=`<div class="cat">${c[0]}</div>`;
        c[1].forEach(x=>{
          const on=s.used.includes(x[0]);
          html+=`<label class="site ${on?"on":""}"><input type="checkbox" data-act="chk" data-site="${esc(x[0])}" ${on?"checked":""}>`
            +`<span>${esc(x[0])}</span><span class="p">₱${x[1]}</span></label>`;
        });
      });
    }
    html+=`</div></div>`;
  });
  renderSitePanel(p,arr);
  $("list").innerHTML=html||(($("sitePanel").innerHTML)?"":'<div class="mu" style="text-align:center;padding:30px">No SIMs yet. Scan or type a number.</div>');
  $("list").style.display=desk?"none":"";
  renderSheet(p);
  greet();
  $("stats").textContent=sims.length+" SIMs · ₱"+earn+" done";
}

/* ---------- Event handlers ---------- */
$("list").addEventListener("click",e=>{
  const card=e.target.closest(".card[data-id]");if(!card)return;
  const s=sims.find(x=>String(x.id)===card.dataset.id);if(!s)return;
  const el=e.target.closest("[data-act]");
  const act=el?el.dataset.act:null;
  if(act==="copy"){copyText(s.number);return}
  if(act==="edit"){editSim(s.id);return}
  if(act==="del"){deleteSim(s);return}
  if(act==="chk"){
    toggleSite(s,el.dataset.site,el.checked);
    const y=window.scrollY;render();window.scrollTo(0,y);return;
  }
  if(act==="toggle"){openId=openId===s.id?null:s.id;render()}
});

$("sheet").addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-id]");if(!tr)return;
  const s=sims.find(x=>String(x.id)===tr.dataset.id);if(!s)return;
  const act=e.target.dataset.act;
  if(act==="copy")copyText(s.number);
  else if(act==="edit")editSim(s.id);
  else if(act==="del")deleteSim(s);
  else if(act==="chk"){toggleSite(s,e.target.dataset.site,e.target.checked);render()}
});

$("sitePanel").addEventListener("click",e=>{
  if(e.target.dataset.copy){copyText(e.target.dataset.copy);return}
  const chip=e.target.closest("[data-open]");
  if(chip){
    openId=sims.find(x=>String(x.id)===chip.dataset.open)?.id??null;
    render();
    const card=document.querySelector(`#list .card[data-id="${chip.dataset.open}"]`);
    if(card)card.scrollIntoView({behavior:"smooth",block:"center"});
  }
});

$("q").addEventListener("input",render);

function fixManual(){
  const d=cleanNum($("manual").value);
  $("manual").value=d;
  const c=$("cnt");c.textContent=d.length+"/11";c.style.color=d.length===11?"var(--ok)":"";
}
$("manual").addEventListener("input",fixManual);
$("addBtn").onclick=()=>{
  if(addSim($("manual").value,$("manualSlot").value,$("carrier").value)){
    $("manual").value="";$("manualSlot").value="";fixManual();
  }
};
$("manual").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});

/* ---------- Voice input ---------- */
function parseSpoken(t){
  return t.toLowerCase().split(/[\s,.\-]+/).map(tok=>{
    if(/^\d+$/.test(tok))return tok;
    return W[tok]!==undefined?String(W[tok]):"";
  }).join("");
}
$("micBtn").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voice input not supported on this browser");return}
  const rec=new SR();
  rec.lang="en-PH";rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=e=>{
    $("manual").value=parseSpoken(e.results[0][0].transcript);
    fixManual();
  };
  rec.onerror=()=>toast("Voice input failed, try again");
  rec.start();
  toast("Listening…");
};

/* ---------- Barcode scanner ---------- */
let scanCtrl=null,scanReader=null;
async function startScan(){
  $("scan").style.display="block";
  $("scanMsg").textContent="Point the camera at the barcode…";
  try{
    scanReader=new ZXing.BrowserMultiFormatReader();
    scanCtrl=await scanReader.decodeFromConstraints(
      {video:{facingMode:"environment"}},$("vid"),
      (res)=>{
        if(!res)return;
        const n=normNum(res.getText());
        if(n){
          if(addSim(res.getText(),"",$("carrier").value)){
            stopScan();
          }else{
            $("scanMsg").textContent="Not added. Keep scanning…";
          }
        }else{
          $("scanMsg").textContent="Not a phone number: "+res.getText();
        }
      });
  }catch(err){
    toast("Camera not available");
    stopScan();
  }
}
function stopScan(){
  try{if(scanCtrl)scanCtrl.stop()}catch(e){}
  scanCtrl=null;
  $("scan").style.display="none";
}
$("scanBtn").onclick=startScan;
$("stopBtn").onclick=stopScan;

/* ---------- Save / restore ---------- */
$("dlBtn").onclick=()=>{
  const data=JSON.stringify({app:"sim_otp_manager",version:3,exported:new Date().toISOString(),sims},null,2);
  const blob=new Blob([data],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="sim-otp-backup-"+new Date().toISOString().slice(0,10)+".txt";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Backup saved");
};
$("up").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const list=Array.isArray(obj)?obj:obj.sims;
      if(!Array.isArray(list))throw new Error("bad");
      const clean=list.filter(s=>s&&normNum(s.number)).map(s=>({
        id:s.id||Date.now()+Math.random(),
        number:normNum(s.number),
        slot:String(s.slot||""),
        carrier:String(s.carrier||""),
        used:Array.isArray(s.used)?s.used:[],
        barred:!!s.barred,
        netBad:!!s.netBad
      }));
      if(!confirm(`Restore ${clean.length} SIM(s)? This replaces the current list.`)){e.target.value="";return}
      sims=clean;save();render();toast("Restored "+clean.length+" SIM(s)");
    }catch(err){toast("Invalid backup file")}
    e.target.value="";
  };
  r.readAsText(f);
});

/* ---------- Menu ---------- */
$("menuBtn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("show")};
document.addEventListener("click",()=>$("menu").classList.remove("show"));
$("menu").addEventListener("click",e=>{
  const m=e.target.dataset.m;if(!m)return;
  $("menu").classList.remove("show");
  if(m==="how"){
    $("mbox").innerHTML=`<h2>📖 How to use</h2><ol>
      <li>Scan a SIM barcode or type/speak its number, pick the SIM network, then tap <b>Add</b>.</li>
      <li>Tap a number card to open it and tick the sites it has already been used for.</li>
      <li>Tap the <b>?</b> or ✏️ to set the box number and status (Barred or Network not working).</li>
      <li>Search with <b>box 30</b> to see SIMs in that box, <b>sim TNT</b> to filter by SIM, or type a site name like Grab.</li>
      <li>Use 💾 Save to back up your list, and 📂 Restore to load it again.</li></ol>
      <div class="row"><button id="mClose">Close</button></div>`;
    $("modal").style.display="flex";$("mClose").onclick=()=>$("modal").style.display="none";
  }
  else if(m==="desk")toggleDesk();
  else if(m==="name")askName(false);
  else if(m==="theme")toggleTheme();
  else if(m==="log"){
    $("mbox").innerHTML=`<h2>📝 Changelog</h2>`+CHANGES.map(c=>`<div class="mu" style="margin-top:6px"><b>${c.v}</b></div><ul style="padding-left:20px;margin:4px 0 10px">`+c.items.map(i=>`<li>${i}</li>`).join("")+`</ul>`).join("")
      +`<div class="row"><button id="mClose">Close</button></div>`;
    $("modal").style.display="flex";$("mClose").onclick=()=>$("modal").style.display="none";
  }
  else if(m==="by"){
    $("mbox").innerHTML=`<h2>👤 Made by Norwell</h2><p>SIM OTP Manager</p><div class="row"><button id="mClose">Close</button></div>`;
    $("modal").style.display="flex";$("mClose").onclick=()=>$("modal").style.display="none";
  }
});
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("modal").style.display="none"});

/* ---------- Init ---------- */
(function init(){
  load();loadName();
  try{desk=localStorage.getItem(KEYD)==="1"}catch(e){}
  applyDesk();
  let t=null;try{t=localStorage.getItem(KEYT)}catch(e){}
  if(t)applyTheme(t);
  else applyTheme(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  render();
  if(!userName)askName(true);
  else maybeNotice();
})();
</script>
